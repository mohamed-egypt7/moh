<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك... ⏳</title>
    
    <!-- كود إثبات الملكية وجوجل أدسنس الخاص بك -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7477909490779964" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 70px 15px;
        }

        /* المساحات الإعلانية (فوق وتحت) */
        .ad-banner-top, .ad-banner-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px dashed #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }
        .ad-banner-top { top: 0; border-top: none; border-left: none; border-right: none; }
        .ad-banner-bottom { bottom: 0; border-bottom: none; border-left: none; border-right: none; }

        /* مساحات إعلانية اليمين واليسار (ممتدة بطول الشاشة) */
        .ad-side {
            position: fixed;
            top: 70px;
            bottom: 70px;
            width: 180px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px dashed #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            text-align: center;
            padding: 10px;
        }
        .ad-left { left: 10px; }
        .ad-right { right: 10px; }

        @media (max-width: 1200px) {
            .ad-side { display: none; } /* إخفاء الجانبين على الموبايل تلقائياً */
        }

        /* صندوق المحتوى الرئيسي في المنتصف */
        .redirect-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            z-index: 10;
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 22px;
        }

        /* صندوق الدومين (غير قابل للضغط ومقصود لعرض اسم الدومين فقط) */
        .destination-box {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: bold;
            direction: ltr;
            user-select: none;
            pointer-events: none;
        }

        .countdown-circle {
            font-size: 48px;
            font-weight: bold;
            color: #f43f5e;
            margin: 15px 0;
        }

        .info-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- مساحة إعلانية علوية -->
    <div class="ad-banner-top">
        <span>مساحة إعلانية</span>
    </div>

    <!-- مساحة إعلانية أيسر ممتدة -->
    <div class="ad-side ad-left">
        <span>مساحة إعلانية</span>
    </div>

    <!-- مساحة إعلانية أيمن ممتدة -->
    <div class="ad-side ad-right">
        <span>مساحة إعلانية</span>
    </div>

    <!-- محتوى صفحة التوجيه في المنتصف -->
    <div class="redirect-card">
        <h2>جاري تحويلك الآن... 🚀</h2>
        <div class="info-text">الدومين المستهدف:</div>
        
        <!-- اسم الدومين فقط وغير قابل للضغط -->
        <div class="destination-box" id="targetName">جاري التحميل...</div>

        <div class="info-text">سيتم التوجيه تلقائياً خلال:</div>
        
        <!-- العداد التنازلي -->
        <div class="countdown-circle" id="counter">10</div>
    </div>

    <!-- مساحة إعلانية سفلية -->
    <div class="ad-banner-bottom">
        <span>مساحة إعلانية</span>
    </div>

    <script>
        let rawHash = window.location.hash;
        let targetUrl = "https://cognoor.vercel.app";

        if (rawHash.startsWith("#!")) {
            targetUrl = rawHash.substring(2);
        } else if (rawHash.startsWith("#")) {
            targetUrl = rawHash.substring(1);
        }

        // استخراج اسم الدومين فقط بصيغة صافية
        let domainOnly = targetUrl;
        try {
            let parsedObj = new URL(targetUrl.includes('http') ? targetUrl : 'https://' + targetUrl);
            domainOnly = parsedObj.hostname.replace('www.', '');
        } catch(e) {
            domainOnly = targetUrl;
        }

        document.getElementById('targetName').innerText = domainOnly;

        let timeLeft = 10;
        const counterElement = document.getElementById('counter');

        const countdownTimer = setInterval(() => {
            timeLeft--;
            counterElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                
                // التأكد من وجود البروتوكول في الرابط
                let finalDestination = targetUrl.includes('http') ? targetUrl : 'https://' + targetUrl;
                
                // استخدام replace لمنع الرجوع لهذه الصفحة نهائياً من سجل المتصفح
                window.location.replace(finalDestination);
            }
        }, 1000);
    </script>
</body>
</html>
